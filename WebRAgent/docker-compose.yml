services:
  # RAG Flask application
  app:
    image: ghcr.io/dkruyt/webragent:latest
    network_mode: "host"
    environment:
    # ВАЖНО: это НЕ localhost, и это принципиально.
    # В этом окружении VPN перехватывает loopback и обрывает всё крупнее ~16 КБ.
    # Запрос к LLM с контекстом из базы знаний весит десятки КБ, поэтому через
    # localhost он висел до таймаута и Ollama отдавал 500 ("Error generating
    # response") — именно из-за этого поиск в базе «не работал» и висел.
    # 172.17.0.1 — docker bridge gateway (хост изнутри контейнера), такие
    # запросы проходят мгновенно. Ollama поэтому слушает 0.0.0.0 (см. run_all.sh).
    - OLLAMA_URL=http://172.17.0.1:11434
    - OLLAMA_HOST=http://172.17.0.1:11434
    - QDRANT_URL=http://172.17.0.1:6333
    - QDRANT_HOST=172.17.0.1
    - QDRANT_PORT=6333
    - SEARXNG_URL=http://localhost:8080
    - MONGODB_URI=mongodb://localhost:27017/ragapp
    - FLASK_DEBUG=1
    # ports:
    #   - "5000:5000"
    env_file:
     - ./.env
    volumes:
      - ./data:/app/data
      # Монтируем локальный код поверх образа, чтобы правки в app/ применялись
      # без пересборки (Flask debug автоматически перезагружает при изменении).
      - ./app:/app/app
      # run.py монтируем тоже: он задаёт threaded=True (параллельная обработка
      # запросов) и use_reloader=False (без перезапуска на лету, который рвал
      # длинные операции — например, заливку базы знаний).
      - ./run.py:/app/run.py
    depends_on:
      - qdrant
      - searxng
      - mongodb
    restart: unless-stopped
    

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    
  # SearXNG web search service
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=RAG Web Search
      - AUTOCOMPLETE=google
      - ENABLE_METRICS=0
      # Прокси для исходящих запросов к поисковикам (Google, Yandex и т.п.).
      # host.docker.internal указывает на хост, где живёт прокси (127.0.0.1).
      # Значение можно переопределить: PROXY_URL=http://host:port docker compose up -d
      - HTTP_PROXY=${PROXY_URL:-}
      - HTTPS_PROXY=${PROXY_URL:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1,searxng}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      
  # MongoDB for chat history
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db 
    environment:
      - MONGO_INITDB_DATABASE=ragapp
    restart: unless-stopped

  # Ollama запускается глобально через `ollama serve` (см. run_all.sh)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

volumes:
  qdrant_data:
  mongodb_data:
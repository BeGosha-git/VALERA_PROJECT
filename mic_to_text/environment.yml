name: mic_to_text_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - portaudio           # системная библиотека для sounddevice
  - pip:
    # kairos-asr тянет совместимый torch автоматически (рабочая версия 2.13+cu130).
    # НЕ ставить pytorch отдельной conda-зависимостью — это вызывало iJIT_NotifyEvent.
    - kairos-asr[cpu]>=0.7.0
    - sounddevice>=0.5.0
    - silero-vad>=5.1
    - soundfile>=0.12.0
    - numpy>=1.23.5
    - scipy>=1.15.0
    - noisereduce>=3.0.0
    - "httpx[socks]>=0.28.0"
    - setuptools>=65.0.0
    - requests
    - beautifulsoup4
    - transliterate
    - num2words
    - simpleaudio
    - python-dotenv
    # Для STT через NVIDIA Nemotron (--stt nemotron)
    - "transformers>=5.13.0"
    - librosa>=0.10.0
    - accelerate>=0.20.0

name: tts_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # kairos-asr нужен TALK.py для STT и тянет совместимый torch (2.13+cu130).
    # НЕ ставить pytorch отдельной conda-зависимостью — это вызывало iJIT_NotifyEvent.
    - kairos-asr[cpu]>=0.7.0
    - fastapi
    - "uvicorn[standard]"
    - pydantic
    - transformers
    - numpy
    - scipy
    - soundfile
    - librosa
    - beautifulsoup4
    - requests
    - transliterate
    - num2words
    - simpleaudio
    - python-dotenv